name: Marktplaats alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a test alert"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

concurrency:
  group: marktplaats-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ inputs.test_mode }}" == "yes" ]]; then
            python check.py --test
          else
            # Run for ~4 minutes, checking every 60s.
            # This way each scheduled trigger gives us many checks,
            # making us resilient to GitHub Actions cron lag.
            python check.py --loop 4
          fi

      - name: Commit updated seen.json
        if: ${{ inputs.test_mode != 'yes' }}
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name  "marktplaats-bot"
            git config user.email "marktplaats-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen.json [skip ci]"
            git pull --rebase || true
            git push
          else
            echo "No changes to commit."
          fi
