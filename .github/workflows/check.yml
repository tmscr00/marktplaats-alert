name: Marktplaats alert

on:
  # Backup GitHub schedule — in case cron-job.org ever fails, we still get
  # a check every ~5-15 min (when GitHub feels like it).
  schedule:
    - cron: "*/5 * * * *"
  # Primary trigger: cron-job.org will POST to GitHub's API every minute
  # to trigger this workflow_dispatch event.
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a test alert"
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

# If a run is already in flight when the next trigger arrives, just skip
# the new one. Keeps things sane if checks ever overlap.
concurrency:
  group: marktplaats-alert
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Run checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ inputs.test_mode }}" == "yes" ]]; then
            python check.py --test
          else
            python check.py
          fi

      - name: Commit updated seen.json
        if: ${{ inputs.test_mode != 'yes' }}
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name  "marktplaats-bot"
            git config user.email "marktplaats-bot@users.noreply.github.com"
            git add seen.json
            git commit -m "update seen.json [skip ci]"
            git pull --rebase || true
            git push
          else
            echo "No changes to commit."
          fi
